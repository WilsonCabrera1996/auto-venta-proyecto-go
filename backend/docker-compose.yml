services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoventa_api
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - autoventa_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

networks:
  autoventa_net:
    driver: bridge
    name: autoventa_net
